name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ledgerly
          POSTGRES_PASSWORD: ledgerly_ci
          POSTGRES_DB: ledgerly
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ledgerly:ledgerly_ci@localhost:5432/ledgerly

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace packages/shared

      - name: Run DB migrations
        run: npm run db:migrate --workspace apps/backend

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (VAT engine + backend)
        run: npm run test --workspace apps/backend

      - name: Build all
        run: npm run build

      # TODO: enable secret-scanning (GitHub native, or add gitleaks here)
      # once real HMRC/Companies House/Shopify credentials exist.
