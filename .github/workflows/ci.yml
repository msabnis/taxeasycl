name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace packages/shared

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (VAT engine + backend)
        run: npm run test --workspace apps/backend

      - name: Build all
        run: npm run build

      # TODO: enable secret-scanning (GitHub native, or add gitleaks here)
      # once real HMRC/Companies House/Shopify credentials exist.
